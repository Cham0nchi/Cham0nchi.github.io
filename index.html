        <li class="article-item" data-tags="" data-content="統計的暴落予報（マンガ―・バフェット） 統計的暴落予報（マンガ―・バフェット） ← ログ一覧に戻る 統計的暴落予報（マンガ―・バフェット） 💻 ソースコードを表示: # @title 統計的暴落予報（マンガ―・バフェット）... # @title 統計的暴落予報（マンガ―・バフェット） import yfinance as yf import pandas as pd import numpy as np import datetime import requests import os import warnings from IPython.display import display, Markdown from google.colab import drive warnings.filterwarnings('ignore') # ==== 1. Google Drive マウント設定 ==== drive.mount('/content/drive', force_remount=True) SAVE_PATH = &quot;/content/drive/MyDrive/myhouseaccount/&quot; os.makedirs(SAVE_PATH, exist_ok=True) # ==== 2. 設定・定数 ==== FRED_API_KEY = &quot;c7caf64f73bba6d0ebdbe04f156a78b2&quot; MUNGER_COL_ORDER = [ &quot;実行日&quot;, &quot;市場&quot;, &quot;暴落レベル&quot;, &quot;総合点(Max36)&quot;, &quot;ボラティリティ比率(VI代用)&quot;, &quot;超長期評価乖離率(20年MA)&quot;, &quot;MA400乖離率&quot;, &quot;HYG/TLT乖離率&quot;, &quot;株/債券比率&quot;, &quot;USD/JPY 60日モメンタム(%)&quot;, &quot;AUD/JPY 60日モメンタム(%)&quot;, &quot;金/銅比率 Z-score&quot;, &quot;BTC 200日MA乖離率&quot;, &quot;原油価格 200日MA乖離率&quot; ] # 重みの合計を 1.0 に調整（BTC 0.01を含む） M_WEIGHTS = { &quot;金/銅比率 Z-score&quot;: 0.10, &quot;原油価格 200日MA乖離率&quot;: 0.05, &quot;BTC 200日MA乖離率&quot;: 0.01, # 炭鉱のカナリアとして0.01 &quot;USD/JPY 60日モメンタム(%)&quot;: 0.10, &quot;AUD/JPY 60日モメンタム(%)&quot;: 0.05, &quot;HYG/TLT乖離率&quot;: 0.20, &quot;ボラティリティ比率(VI代用)&quot;: 0.10, &quot;超長期評価乖離率(20年MA)&quot;: 0.14, &quot;MA400乖離率&quot;: 0.20, &quot;株/債券比率&quot;: 0.05 } COUNTRY_CONFIG = { &quot;日本&quot;: {&quot;gdp_sid&quot;: &quot;JPNNGDP&quot;, &quot;index&quot;: &quot;^N225&quot;, &quot;unit&quot;: &quot;円&quot;, &quot;usd_pair&quot;: None, &quot;factor&quot;: 15}, &quot;アメリカ&quot;: {&quot;gdp_sid&quot;: &quot;GDP&quot;, &quot;index&quot;: &quot;^W5000&quot;, &quot;unit&quot;: &quot;ドル&quot;, &quot;usd_pair&quot;: None, &quot;factor&quot;: 0.8}, &quot;中国&quot;: {&quot;gdp_sid&quot;: None, &quot;index&quot;: &quot;000001.SS&quot;, &quot;unit&quot;: &quot;元&quot;, &quot;usd_pair&quot;: &quot;USDCNY=X&quot;, &quot;factor&quot;: 15, &quot;fixed_gdp&quot;: 126000}, &quot;ドイツ&quot;: {&quot;gdp_sid&quot;: &quot;DEUNGDP&quot;, &quot;index&quot;: &quot;^GDAXI&quot;, &quot;unit&quot;: &quot;ユーロ&quot;, &quot;usd_pair&quot;: &quot;EURUSD=X&quot;, &quot;factor&quot;: 0.08}, &quot;インド&quot;: {&quot;gdp_sid&quot;: &quot;INNGDPNQDSMEI&quot;, &quot;index&quot;: &quot;^BSESN&quot;, &quot;unit&quot;: &quot;ルピー&quot;, &quot;usd_pair&quot;: &quot;USDINR=X&quot;, &quot;factor&quot;: 0.5}, &quot;ブラジル&quot;: {&quot;gdp_sid&quot;: &quot;BZNGDPNQDSMEI&quot;, &quot;index&quot;: &quot;^BVSP&quot;, &quot;unit&quot;: &quot;レアル&quot;, &quot;usd_pair&quot;: &quot;USDBRL=X&quot;, &quot;factor&quot;: 0.005}, &quot;韓国&quot;: {&quot;gdp_sid&quot;: &quot;KORNGDPNQDSMEI&quot;, &quot;index&quot;: &quot;^KS11&quot;, &quot;unit&quot;: &quot;ウォン&quot;, &quot;usd_pair&quot;: &quot;USDKRW=X&quot;, &quot;factor&quot;: 0.4}, &quot;ロシア&quot;: {&quot;gdp_sid&quot;: &quot;RUSNGDPNQDSMEI&quot;, &quot;index&quot;: &quot;IMOEX.ME&quot;, &quot;unit&quot;: &quot;ルーブル&quot;, &quot;usd_pair&quot;: &quot;USDRUB=X&quot;, &quot;factor&quot;: 0.2}, &quot;イギリス&quot;: {&quot;gdp_sid&quot;: &quot;UKNGDPNQDSMEI&quot;, &quot;index&quot;: &quot;^FTSE&quot;, &quot;unit&quot;: &quot;ポンド&quot;, &quot;usd_pair&quot;: &quot;GBPUSD=X&quot;, &quot;factor&quot;: 0.3}, &quot;カナダ&quot;: {&quot;gdp_sid&quot;: None, &quot;index&quot;: &quot;^GSPTSE&quot;, &quot;unit&quot;: &quot;カナダドル&quot;, &quot;usd_pair&quot;: &quot;USDCAD=X&quot;, &quot;factor&quot;: 0.1, &quot;fixed_gdp&quot;: 2800} } # ==== 3. 補助関数 ==== def save_to_drive(df_new, filename): path = os.path.join(SAVE_PATH, filename) key_col = '市場' if '市場' in df_new.columns else '国' if os.path.exists(path): try: df_old = pd.read_csv(path) df_combined = pd.concat([df_new, df_old], ignore_index=True) df_combined.drop_duplicates(subset=['実行日', key_col], keep='first').to_csv(path, index=False, encoding=&quot;utf-8-sig&quot;) print(f&quot;✅ Google Drive保存完了: {filename}&quot;) except: df_new.to_csv(path, index=False, encoding=&quot;utf-8-sig&quot;) else: df_new.to_csv(path, index=False, encoding=&quot;utf-8-sig&quot;) print(f&quot;🆕 新規ファイル作成: {filename}&quot;) def format_jpy(n_billion_jpy): if n_billion_jpy <= 0 or pd.isna(n_billion_jpy): return &quot;N/A&quot; t, b = int(n_billion_jpy // 1000), int(n_billion_jpy % 1000) res = &quot;&quot; if t > 0: res += f&quot;{t}兆&quot; if b > 0: res += f&quot;{b}億&quot; return res + &quot;円&quot; if res != &quot;&quot; else &quot;0円&quot; def get_fred_raw(series_id): if not series_id: return 0.0 try: url = f&quot;https://api.stlouisfed.org/fred/series/observations?series_id={series_id}&api_key={FRED_API_KEY}&file_type=json&sort_order=desc&limit=1&quot; res = requests.get(url, timeout=10).json() if 'observations' in res and len(res['observations']) > 0: val = res['observations'][0]['value'] return float(val) if val != &quot;.&quot; else 0.0 return 0.0 except: return 0.0 def normalize_gdp(val, country): if val <= 0: return {&quot;ドイツ&quot;: 4200, &quot;インド&quot;: 320000, &quot;ブラジル&quot;: 11000, &quot;韓国&quot;: 2200000, &quot;ロシア&quot;: 190000, &quot;イギリス&quot;: 2600}.get(country, 0.0) if val > 10**11: return val / 10**6 if val > 10**9: return val / 10**3 return val def assign_general_level(val): if pd.isna(val): return 4.0 if val >= 15: return 1.0 if val >= 8: return 2.0 if val >= 2: return 3.0 if val > -2: return 4.0 if val > -8: return 5.0 return 6.0 def assign_volatility_level(ratio): if pd.isna(ratio): return 4.0 # --- 警戒・危機（両極端） --- if ratio >= 1.5: return 1.0 # L1: パニック（急落中） if ratio >= 1.25: return 2.0 # L2: 荒れ始め if ratio <= 0.70: return 1.0 # L1: 嵐の前の静けさ（異常な無風） if ratio <= 0.85: return 2.0 # L2: 静かすぎ（不気味な楽観） # --- 割安・適正（健全な波動） --- if 0.95 <= ratio <= 1.05: return 6.0 # L6: 理想的な波動（健全な買い場） if 0.90 <= ratio <= 1.15: return 5.0 # L5: 適正な押し目 return 4.0 # L4: 標準 def assign_hyg_tlt_level(val): if pd.isna(val): return 4.0 if val >= 3.0: return 1.0 # 歴史的過熱 if val >= 2.0: return 2.0 # 過熱警戒 if val <= -2.0: return 2.0 # 暴落・パニック発生中 if val >= 1.0: return 3.0 # やや強気 if val <= -1.1: return 6.0 # 絶好の買い場 if val <= -0.6: return 5.0 # 割安 return 4.0 def assign_usdjpy_level(val): &quot;&quot;&quot;USD/JPY専用：急激な円安(L1)と急激な円高(L2)の両面を判定&quot;&quot;&quot; if pd.isna(val): return 4.0 if val >= 8.0: return 1.0 # L1: 円安バブル・キャリートレードの極致。 if val >= 4.0: return 3.0 # L3: 円安進行 if val <= -6.0: return 2.0 # L2: 急激な円高ショック（パニック） if val <= -4.0: return 6.0 # L6: 絶好の買い場（底値） if val <= -2.0: return 5.0 # L5: 押し目 return 4.0 # L4: 正常 def assign_stock_bond_level(val): &quot;&quot;&quot;株/債券比率専用：株への過度な集中(L1)と株の投げ売り(L2)を判定&quot;&quot;&quot; if pd.isna(val): return 4.0 if val >= 15.0: return 1.0 # L1: 株バブル（過熱の極致） if val >= 8.0: return 3.0 # L3: 株偏重 if val <= -12.0: return 2.0 # L2: 株パニック（債券への資金逃避） if val <= -8.0: return 6.0 # L6: 絶好の株買い場（逆張り好機） if val <= -2.0: return 5.0 # L5: 適正な押し目 return 4.0 # L4: 正常レンジ def assign_audjpy_level(val): &quot;&quot;&quot;AUD/JPY専用：円安バブル(L1)と急激な円高ショック(L2)を判定&quot;&quot;&quot; if pd.isna(val): return 4.0 if val >= 8.0: return 1.0 # L1: 円安バブル・楽観の極致 if val >= 4.0: return 3.0 # L3: やや過熱 if val <= -8.0: return 2.0 # L2: 円高ショック・パニック発生（警戒） if val <= -4.5: return 6.0 # L6: 絶好の買い場（底値圏） if val <= -2.0: return 5.0 # L5: 健全な調整（押し目） return 4.0 # L4: 正常 def assign_gold_copper_level(val): &quot;&quot;&quot;金/銅比率：不況(高)と過熱(低)の両方を判定&quot;&quot;&quot; if pd.isna(val): return 4.0 if val >= 2.0: return 1.0 # L1: 強烈な不況懸念 if val >= 1.5: return 2.0 # L2: 景気後退の兆候 if val <= -2.0: return 1.0 # L1: 資源バブル・利上げ直前警戒 if val <= -1.5: return 2.0 # L2: 景気過熱 if -0.5 <= val <= 0.5: return 6.0 # L6: 理想的な成長バランス return 4.0 def assign_btc_level(val): if pd.isna(val): return 4.0 if val >= 60: return 1.0 if val >= 30: return 2.0 if val >= 10: return 3.0 if val > -10: return 4.0 if val > -30: return 5.0 return 6.0 def assign_buffett_level(ratio_percent): if pd.isna(ratio_percent) or ratio_percent <= 0: return 4 if ratio_percent >= 150: return 1 if ratio_percent >= 120: return 2 if ratio_percent >= 100: return 3 if ratio_percent >= 75: return 4 if ratio_percent >= 50: return 5 return 6 # ==== 4. メイン分析ロジック ==== def run_analysis(): today = datetime.datetime.today().strftime(&quot;%Y-%m-%d&quot;) print(f&quot;🚀 {today} のデータを取得・分析中...&quot;) fx_list = [&quot;USDJPY=X&quot;, &quot;EURUSD=X&quot;, &quot;GBPUSD=X&quot;, &quot;USDCNY=X&quot;, &quot;USDINR=X&quot;, &quot;USDBRL=X&quot;, &quot;USDKRW=X&quot;, &quot;USDRUB=X&quot;, &quot;USDCAD=X&quot;, &quot;AUDJPY=X&quot;] idx_tickers = [cfg['index'] for cfg in COUNTRY_CONFIG.values()] com_tickers = [&quot;GC=F&quot;, &quot;HG=F&quot;, &quot;BTC-USD&quot;, &quot;CL=F&quot;, &quot;TLT&quot;, &quot;HYG&quot;, &quot;^GSPC&quot;, &quot;^N225&quot;] all_tickers = list(set(fx_list + idx_tickers + com_tickers)) df_yf = yf.download(all_tickers, period=&quot;21y&quot;, progress=False, auto_adjust=True)[&quot;Close&quot;].ffill() latest = df_yf.iloc[-1] usdjpy = latest[&quot;USDJPY=X&quot;] # --- 共通指標計算 --- gc_ratio = (df_yf['GC=F'] / df_yf['HG=F']).dropna() ht_ratio = (df_yf['HYG'] / df_yf['TLT']).dropna() common_metrics = { &quot;金/銅比率 Z-score&quot;: (gc_ratio.iloc[-1] - gc_ratio.mean()) / gc_ratio.std() * 5, &quot;原油価格 200日MA乖離率&quot;: ((latest['CL=F'] / df_yf['CL=F'].rolling(200).mean().iloc[-1]) - 1) * 100, &quot;BTC 200日MA乖離率&quot;: ((latest['BTC-USD'] / df_yf['BTC-USD'].rolling(200).mean().iloc[-1]) - 1) * 100, &quot;USD/JPY 60日モメンタム(%)&quot;: ((latest['USDJPY=X'] / df_yf['USDJPY=X'].rolling(60).mean().iloc[-1]) - 1) * 100, &quot;AUD/JPY 60日モメンタム(%)&quot;: ((latest['AUDJPY=X'] / df_yf['AUDJPY=X'].rolling(60).mean().iloc[-1]) - 1) * 100, &quot;HYG/TLT乖離率&quot;: ((ht_ratio.rolling(20).mean().iloc[-1] / ht_ratio.rolling(200).mean().iloc[-1]) - 1) * 100 } # --- マンガースコア分析 --- m_rows = [] for label, tkr in [(&quot;日本&quot;, &quot;^N225&quot;), (&quot;米国&quot;, &quot;^GSPC&quot;)]: p = df_yf[tkr] v_ratio = p.pct_change().rolling(20).std().iloc[-1] / p.pct_change().rolling(200).std().iloc[-1] spec = { &quot;ボラティリティ比率(VI代用)&quot;: v_ratio, &quot;超長期評価乖離率(20年MA)&quot;: ((latest[tkr] / p.rolling(5000).mean().iloc[-1]) - 1) * 100, &quot;MA400乖離率&quot;: ((latest[tkr] / p.rolling(400).mean().iloc[-1]) - 1) * 100, &quot;株/債券比率&quot;: (((latest[tkr]/latest['TLT']) / (df_yf[tkr]/df_yf['TLT']).rolling(200).mean().iloc[-1]) - 1) * 100 } w_sum_raw, row = 0, {&quot;実行日&quot;: today, &quot;市場&quot;: label} for k, w in M_WEIGHTS.items(): val = spec.get(k, common_metrics.get(k)) # 修正後のループ内分岐 if k == &quot;ボラティリティ比率(VI代用)&quot;: lvl = assign_volatility_level(val) elif k == &quot;HYG/TLT乖離率&quot;: lvl = assign_hyg_tlt_level(val) # ここを追加 elif k == &quot;株/債券比率&quot;: lvl = assign_stock_bond_level(val) # ここを追加 elif k == &quot;USD/JPY 60日モメンタム(%)&quot;: lvl = assign_usdjpy_level(val) # ここを追加 elif k == &quot;AUD/JPY 60日モメンタム(%)&quot;: lvl = assign_audjpy_level(val) # ここを追加 elif k == &quot;BTC 200日MA乖離率&quot;: lvl = assign_btc_level(val) else: lvl = assign_general_level(val) w_sum_raw += lvl * w row[k] = f&quot;{val:.2f} (L{int(lvl)})&quot; total_36 = w_sum_raw * 6 if total_36 <= 8.5: crash_lvl = 1 elif total_36 <= 14.5: crash_lvl = 2 elif total_36 <= 20.5: crash_lvl = 3 elif total_36 <= 26.5: crash_lvl = 4 elif total_36 <= 32.5: crash_lvl = 5 else: crash_lvl = 6 row[&quot;暴落レベル&quot;], row[&quot;総合点(Max36)&quot;] = crash_lvl, f&quot;{total_36:.2f}&quot; m_rows.append(row) m_df = pd.DataFrame(m_rows)[MUNGER_COL_ORDER] # --- バフェット指数分析 --- b_rows = [] for country, cfg in COUNTRY_CONFIG.items(): idx_val = latest[cfg['index']] if country == &quot;日本&quot;: fx_jpy, fx_display = 1.0, &quot;1.00 円&quot; elif country == &quot;アメリカ&quot;: fx_jpy, fx_display = usdjpy, f&quot;{usdjpy:.2f} 円/ドル&quot; else: rate = latest[cfg['usd_pair']] fx_jpy = usdjpy / rate if &quot;USD&quot; == cfg['usd_pair'][:3] else rate * usdjpy fx_display = f&quot;{fx_jpy:.2f} 円/{cfg['unit']}&quot; mcap_jpy = (idx_val * cfg['factor']) * fx_jpy display_country = country if country in [&quot;中国&quot;, &quot;カナダ&quot;]: g_local = cfg['fixed_gdp'] display_country = f&quot;{country}(GDP固定値)&quot; else: raw_gdp = get_fred_raw(cfg['gdp_sid']) g_local = normalize_gdp(raw_gdp, country) if g_local > 0: gdp_jpy = g_local * fx_jpy ratio = (mcap_jpy / gdp_jpy) * 100 gdp_ja = format_jpy(gdp_jpy) ratio_str = f&quot;{ratio:.2f}%&quot; ratio_num = ratio else: gdp_jpy, gdp_ja, ratio_str, ratio_num = 0, &quot;取得失敗&quot;, &quot;N/A&quot;, -1 b_lvl = assign_buffett_level(ratio_num) b_rows.append({ &quot;実行日&quot;: today, &quot;国&quot;: display_country, &quot;暴落レベル&quot;: b_lvl, &quot;バフェット指数(%)&quot;: ratio_str, &quot;GDP(円換算)&quot;: gdp_ja, &quot;時価総額近似(円換算)&quot;: format_jpy(mcap_jpy), &quot;株価指数生データ&quot;: f&quot;{idx_val:,.0f} {cfg['unit']}&quot;, &quot;対円為替&quot;: fx_display, &quot;_ratio_sort&quot;: ratio_num }) b_df = pd.DataFrame(b_rows).sort_values(&quot;_ratio_sort&quot;, ascending=False) b_df = b_df[[&quot;実行日&quot;, &quot;国&quot;, &quot;暴落レベル&quot;, &quot;バフェット指数(%)&quot;, &quot;GDP(円換算)&quot;, &quot;時価総額近似(円換算)&quot;, &quot;株価指数生データ&quot;, &quot;対円為替&quot;]] save_to_drive(m_df, &quot;munger_score.csv&quot;) save_to_drive(b_df, &quot;buffett_index.csv&quot;) return m_df, b_df # ==== 5. 解説・表示 ==== def display_full_explanation(): exp = &quot;&quot;&quot; --- ### 🛡️ 1. マンガースコア指標解説 (L1=暴落直前、L6=割安) **◉マンガースコア**: 市場の過熱・恐怖を10指標で数値化し、L1(暴落目前)からL6(絶好の買い場)まで6段階で判定。 * **ボラティリティ比率**: 1.5超(パニック)か0.85以下(嵐の前の静けさ)でL1〜L2、1.0前後でL6(健全)。 * **超長期評価乖離率(20年MA)**: 20年平均から+15%超で歴史的過熱(L1)、-8%以下で大底(L6)。 * **MA400乖離率**: 400日線から+15%超で短期バブル(L1)、-8%以下で売られすぎ。 * **HYG/TLT乖離率**: 米国のジャンク債と国債の買われ方。+3%超(L1)または-2.0%以下(L2)で警戒。中間のマイナス圏でL6。 * **株/債券比率**: 200日平均比で+15%超なら株集中が危険(L1)、-8%以下は債券優位。 * **USD/JPY 60日モメンタム**: +8%超で円安バブル、-8%以下で急激な円高。 * **AUD/JPY 60日モメンタム**: 豪ドルが買われ（円安）で+8%超でリスクオンの過熱、円が買われ（円高）ると-8%以下で世界景気後退リスク。 * **BTC 200日MA乖離率**: +60%超でバブル(L1)、-40%以下で総投げ・底値(L6)。※重み0.01設定 * **原油価格 200日MA乖離率**: +15%超でインフレ圧迫、-8%以下で需要減退サイン。 ### 🏛️ 2. バフェット指数解説 * **レベル1 (深刻なバブル)**: 指数150%以上。歴史的な過熱状態。 * **レベル2~3 (割高)**: 指数100%〜149%。警戒が必要な領域。 * **レベル4 (適正)**: 指数75%〜99%。 * **レベル5~6 (割安)**: 指数75%未満。長期的な投資チャンス。 &quot;&quot;&quot; display(Markdown(exp)) # 実行 m_df, b_df = run_analysis() display(Markdown(&quot;# 📊 分析レポート&quot;)) display(Markdown(&quot;## ■ マンガ―スコア&quot;)) display(m_df) display(Markdown(&quot;## ■ バフェット指数＆マクロ指標&quot;)) display(b_df) display_full_explanation()"><a href="Posts/20260726/統計的暴落予報（マンガ―・バフェット）.html">統計的暴落予報（マンガ―・バフェット）</a><span class="path">(Posts/20260726/統計的暴落予報（マンガ―・バフェット）.html)</span></li>

    <script>
        let currentTag = 'ALL';

            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.getElementsByClassName('article-item');
            for (let i = 0; i < items.length; i++) {
                let searchTarget = items[i].getAttribute('data-content').toLowerCase();

                items[i].style.display = (matchesSearch && matchesTag) ? "" : "none";
            }
        }
        function filterByTag(tagName) {
            currentTag = tagName;
            let badges = document.getElementsByClassName('tag-badge');
            for (let b of badges) {
                b.classList.toggle('active', b.textContent === (tagName === 'ALL' ? 'すべて' : '#' + tagName));
            }
            filterArticles();
        }
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tagParam = urlParams.get('tag');
            if (tagParam) filterByTag(tagParam);
        };
