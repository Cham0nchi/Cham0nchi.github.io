か。 主問題： 月や太陽の位置の変化などから予想しよう。 自分の考え： 友だちの考え・気づいたこと： まとめ： 時間がたつと星の位置は変わるが星のならび方は変わらない。 振り返り： 家庭用学習プリント 【理科】 星や月 6 ＊＊＊毎日コツコツ、一歩ずつ！＊＊＊ ＿＿年＿＿組 名前：＿＿＿＿＿＿＿＿＿ 【問題1】 午後7時と午後9時に南の空を観察して、オリオン座の星のならび方を記録しました。次の文の（ ）にあてはまることばを、あとの【 】の中からえらんで書きましょう。 時間がたつと、星のいち（ばしょ）は（ ① ）が、星のならび方は（ ② ）。 この動きは、昼間に見た（ ③ ）や、夜に見える（ ④ ）の動きと同じです。 【 えらぶことば： 変わる ・ 変わらない ・ 太陽 ・ 月 】 【答えをかくらん】 ① ② ③ ④ 【問題2】 星が時間がたつと動いていることをたしかめるために、星の観察をするときにはどのような工夫をするとよいですか。正しいものを すべて えらんで、記号で答えましょう。 ア： 木や建物などの動かない「めじるし」をいっしょに記録する。 イ： 観察する方角を、東や南など決めておく。 ウ： 観察する時間を1時間や2時間あけて、同じ場所から見る。 エ： 観察する場所を、時間ごとに遠くへ変えてみる。 【答えをかくらん】 記号： 選んだりゆう： ★ 星の豆知識：北の空にある「動かない星」？ すべての星が動いているように見えますが、北の空には時間がたってもほとんど場所が変わらない「北極星（ほっきょくせい）」という星があります。 ほかの星は、この北極星を中心にして、大きな円をえがくように回って見えます。昔の旅人は、夜に北極星を見て方角をたしかめていたそうですよ！ 【問題3】 けんたさんは、午後7時に南の空に見えた「夏の大三角」を観察しました。そのあと、午後9時にもう一度同じ場所から観察しました。 星の「いち（場所）」と「ならび方（形）」は、午後7時と比べてどのように変わったでしょうか。授業で学習した「まとめ」のことばを使って、お家の人に説明するように分かりやすく書きましょう。 【説明をかくらん】 家庭で教えるためのポイント 本時のねらい： 太陽や月と同じように、星も東から西へ時間がたつと移動すること、しかし星座の形（星同士の距離や並び方）は決して崩れないことを理解することが目標です。 声かけの例： 「夜空を大きなドームだと思ってごらん。星が貼り付いたドームごとゆっくり回っているから、形はそのままで場所だけが動くんだよ」と伝えると、イメージが湧きやすくなります。 観察の工夫： 星の動きを確かめるには「動かない目印（家の屋根や電柱、木など）」との位置関係を比べることが大切です。晴れた夜に、ぜひ窓から同じ星を1時間あけて一緒に眺めてみてください。 ※この宿題は生成AIを元に作成されています。 模範解答・解説 【問題1】 正解： ① 変わる ② 変わらない ③ 太陽（または 月） ④ 月（または 太陽） 【問題2】 正解： ア、イ、ウ 理由の例： 自分が見る場所を変えてしまうと星が動いたのか自分が動いたのか分からなくなるので、同じ場所から木などのめじるしを決めて見ることが大切だから。 【問題3】 記述の例： 時間がたつと、夏の大三角をつくる星のいち（場所）は西の方へ動いて変わりましたが、三角形の星のならび方は変わらず、そのままの形でした。 📌 追加メモ・資料 Satellarium Web Satellarium Web"><a href="Posts/2610/理科 ４年 星や月 6_memo_10200540.html">理科 ４年 星や月 6_memo_10200540</a><span class="path">(Posts/2610/理科 ４年 星や月 6_memo_10200540.html)</span></li>

    <script>
        let selectedTags = [];

        function filterArticles() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.getElementsByClassName('article-item');
            for (let i = 0; i < items.length; i++) {
                let searchTarget = items[i].getAttribute('data-content').toLowerCase();
                let tagsAttr = items[i].getAttribute('data-tags');
                let articleTags = tagsAttr ? tagsAttr.split(',') : [];
                
                let matchesSearch = searchTarget.includes(input);
                let matchesTags = selectedTags.length === 0 || selectedTags.every(t => articleTags.includes(t));

                items[i].style.display = (matchesSearch && matchesTags) ? "" : "none";
            }
        }

        function filterByTag(tagName) {
            if (tagName === 'ALL') {
                selectedTags = [];
            } else {
                let index = selectedTags.indexOf(tagName);
                if (index > -1) {
                    selectedTags.splice(index, 1);
                } else {
                    selectedTags.push(tagName);
                }
            }

            let allBadge = document.getElementById('tag-all');
            if (selectedTags.length === 0) {
                allBadge.classList.add('active');
            } else {
                allBadge.classList.remove('active');
            }

            let badges = document.querySelectorAll('.tag-container .tag-badge:not(#tag-all)');
            for (let b of badges) {
                let t = b.getAttribute('data-tag');
                if (selectedTags.includes(t)) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            }

            filterArticles();
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tagParam = urlParams.get('tag');
            if (tagParam) {
                filterByTag(tagParam);
            }
        };
    </script>
